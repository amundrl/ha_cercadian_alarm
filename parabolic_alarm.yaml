blueprint:
  name: Parabolic Alarm Automation
  description: Turn a light on with a parabolic sunrise effect at a specified time, considering workday and person presence.
  domain: automation
  input:
    pre_action:
      name: 🎮 Pre Script Action
      description: An action to perform before the lights turn on.
      default: []
      selector:
        action: {}
    alarm_start_time:
      name: Start Time
      description: Time to start the alarm (e.g., 06:30). The automation triggers daily at this exact time.
      selector:
        time:
    workday_sensor:
      name: 📆 Workday Sensor (Optional)
      description: Optional binary sensor to restrict the automation (e.g., run only on workdays). Leave empty to run every day.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: false
      default: null
    person_sensor:
      name: 👤 Person Sensor (Optional)
      description: Optional person entity to restrict the automation (e.g., run only when this person is home). Leave empty to run regardless of presence.
      selector:
        entity:
          filter:
            domain: person
          multiple: false
      default: null
    alarm_script:
      name: 📄 Script to Trigger
      description: The script that creates the parabolic light effect.
      selector:
        entity:
          filter:
            domain: script
          multiple: false
    target_light:
      name: 💡 Target Light
      description: The light entity to control (must support color temperature).
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    light_timeout:
      name: ⏱️ Timeout (minutes)
      description: Time after the last phase before the light turns off. Set to 0 to leave the light on.
      default: 10
      selector:
        number:
          min: 0
          max: 60
          step: 1
          mode: slider
    steps_per_minute:
      name: 🏃‍♂️ Steps per Minute
      description: Number of steps per minute for brightness and color temperature transitions.
      default: 12
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
    start_brightness:
      name: ⭐️ Start Brightness (%)
      description: Initial brightness percentage when the light turns on.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    start_kelvin_temp:
      name: ☀️ Start Kelvin
      description: Initial color temperature (Kelvin) for a warm start.
      default: 2500
      selector:
        color_temp:
          unit: kelvin
    target_kelvin_1:
      name: ☀️ Target Kelvin 1
      description: Target color temperature (Kelvin) at the end of phase 1.
      default: 3000
      selector:
        color_temp:
          unit: kelvin
    max_brightness_1:
      name: ⭐️ Max Brightness 1 (%)
      description: Maximum brightness percentage at the end of phase 1.
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    alarm_length_1:
      name: ⏰ Phase 1 Duration (minutes)
      description: Duration of the first phase.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
    target_kelvin_2:
      name: 🌗 Target Kelvin 2
      description: Target color temperature (Kelvin) at the end of phase 2.
      default: 4000
      selector:
        color_temp:
          unit: kelvin
    max_brightness_2:
      name: ⭐️ Max Brightness 2 (%)
      description: Maximum brightness percentage at the end of phase 2.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    alarm_length_2:
      name: ⏰ Phase 2 Duration (minutes)
      description: Duration of the second phase.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
    target_kelvin_3:
      name: 🌑 Target Kelvin 3
      description: Target color temperature (Kelvin) at the end of phase 3.
      default: 6500
      selector:
        color_temp:
          unit: kelvin
    max_brightness_3:
      name: ⭐️ Max Brightness 3 (%)
      description: Maximum brightness percentage at the end of phase 3.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    alarm_length_3:
      name: ⏰ Phase 3 Duration (minutes)
      description: Duration of the third phase.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
    post_action:
      name: 🎮 Post Script Action
      description: An action to perform after the alarm phases complete.
      default: []
      selector:
        action: {}
  source_url: https://github.com/amundrl/ha_cercadian_alarm/blob/main/parabolic_alarm.yaml
trigger:
  - trigger: time
    at: !input alarm_start_time
condition:
  - condition: and
    conditions:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ input('workday_sensor') == None }}"
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ input('workday_sensor') != None }}"
              - condition: state
                entity_id: !input workday_sensor
                state: "on"
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ input('person_sensor') == None }}"
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ input('person_sensor') != None }}"
              - condition: state
                entity_id: !input person_sensor
                state: "home"
action:
  - choose:
      - conditions: []
        sequence: !input pre_action
  - action: light.turn_on
    data:
      entity_id: !input target_light
      brightness_pct: !input start_brightness
      color_temp_kelvin: !input start_kelvin_temp
  - delay:
      seconds: 5
  - action: !input alarm_script
    data:
      target_light: !input target_light
      start_kelvin: !input start_kelvin_temp
      target_kelvin: !input target_kelvin_1
      max_brightness_pct: !input max_brightness_1
      alarm_length: !input alarm_length_1
      steps_per_minute: !input steps_per_minute
      light_timeout: 0
  - if:
      - condition: state
        entity_id: !input target_light
        state: "on"
    then:
      - action: !input alarm_script
        data:
          target_light: !input target_light
          start_kelvin: !input target_kelvin_1
          target_kelvin: !input target_kelvin_2
          max_brightness_pct: !input max_brightness_2
          alarm_length: !input alarm_length_2
          steps_per_minute: !input steps_per_minute
          light_timeout: 0
  - if:
      - condition: state
        entity_id: !input target_light
        state: "on"
    then:
      - action: !input alarm_script
        data:
          target_light: !input target_light
          start_kelvin: !input target_kelvin_2
          target_kelvin: !input target_kelvin_3
          max_brightness_pct: !input max_brightness_3
          alarm_length: !input alarm_length_3
          steps_per_minute: !input steps_per_minute
          light_timeout: !input light_timeout
      - choose:
          - conditions: []
            sequence: !input post_action
mode: single
