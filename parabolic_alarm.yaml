blueprint:
  name: Parabolic Alarm Automation
  description: Turn a light on based on a start time, whether it is a workday, and whether a person is home. This is to match the sunrise and allow for a natural wake-up.
  domain: automation
  input:
    pre_action:
      name: 🎮 Pre Script Action
      description: An action to perform before the lights turn on.
      default: []
      selector:
        action: {}
    alarm_start_time:
      name: Start Time
      description: Time to start the alarm (e.g., 06:30). The automation will trigger daily at this time.
      selector:
        time:
    offset_from_start_time:
      name: 🏁 Offset From Start Time
      description: Adjust the time before or after the Start Time to begin the transition. Enter seconds or HH:MM:SS (e.g., "-00:05:00" for 5 minutes before). See https://www.home-assistant.io/docs/automation/trigger/#sensors-of-datetime-device-class-with-offsets for caution about positive offsets.
      default: "-00:00:00"
      selector:
        text:
    workday_sensor:
      name: 📆 Workday Sensor (Optional)
      description: Optional Binary Sensor to restrict the automation (e.g., run only on workdays). Leave empty to run every day. See https://www.home-assistant.io/integrations/workday/ for details.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: false
      default: null
    person_sensor:
      name: 👤 Person Sensor (Optional)
      description: Optional Person entity to restrict the automation (e.g., run only when this person is home). Leave empty to run regardless of presence. See https://www.home-assistant.io/integrations/person/ for details.
      selector:
        entity:
          filter:
            domain: person
          multiple: false
      default: null
    alarm_script:
      name: 📄 Script to Trigger
      description: Light Alarm Script
      selector:
        entity:
          filter:
            domain: script
          multiple: false
    target_light:
      name: 💡 Lights
      description: The light(s) with kelvin support
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    light_timeout:
      name: ⏱️ Timeout
      description: Light will turn off after this time on last run. Set to 0 to leave the light on.
      default: 10
      selector:
        number:
          min: 0.0
          max: 60.0
          step: 1.0
          mode: slider
    steps_per_minute:
      name: 🏃‍♂️ Steps per Minute
      description: Number of steps per minute for brightness and color temperature transitions
      default: 12
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          mode: slider
    start_brightness:
      name: ⭐️ Start Brightness
      description: Starting brightness percentage
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          mode: slider
      default: 1.0
    start_kelvin_temp:
      name: ☀️ Starting Kelvin
      description: Starting Kelvin value (warm) for first run
      selector:
        color_temp:
          unit: kelvin
      default: 2500
    target_kelvin_1:
      name: ☀️ Target Kelvin 1
      description: Target Kelvin value (cold) for the end of the first run
      selector:
        color_temp:
          unit: kelvin
      default: 3000
    max_brightness_1:
      name: ⭐️ Maximum Brightness 1
      description: Brightness percentage for the end of the first run
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          mode: slider
      default: 10
    alarm_length_1:
      name: ⏰ Alarm Length 1
      description: Duration (minutes) for the first run
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          mode: slider
      default: 10
    target_kelvin_2:
      name: 🌗 Target Kelvin 2
      description: Target Kelvin value (cold) for the end of the second run
      selector:
        color_temp:
          unit: kelvin
      default: 4000
    max_brightness_2:
      name: ⭐️ Maximum Brightness 2
      description: Brightness percentage for the end of the second run
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          mode: slider
      default: 50
    alarm_length_2:
      name: ⏰ Alarm Length 2
      description: Duration (minutes) for the second run
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          mode: slider
      default: 10
    target_kelvin_3:
      name: 🌑 Target Kelvin 3
      description: Target Kelvin value (cold) for the end of the third run
      selector:
        color_temp:
          unit: kelvin
      default: 6500
    max_brightness_3:
      name: ⭐️ Maximum Brightness 3
      description: Brightness percentage for the end of the third run
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          mode: slider
      default: 100
    alarm_length_3:
      name: ⏰ Alarm Length 3
      description: Duration (minutes) for the third run
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          mode: slider
      default: 5
    post_action:
      name: 🎮 Post Script Action
      description: An action to run after the script has finished
      default: []
      selector:
        action: {}
  source_url: https://github.com/amundrl/ha_cercadian_alarm/blob/main/parabolic_alarm.yaml
trigger:
  - trigger: time
    at: !input alarm_start_time
    offset: !input offset_from_start_time
condition:
  - condition: and
    conditions:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ input('workday_sensor') == None }}"
          - condition: state
            entity_id: !input workday_sensor
            state: "on"
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ input('person_sensor') == None }}"
          - condition: state
            entity_id: !input person_sensor
            state: "home"
action:
  - !input pre_action
  - action: light.turn_on
    data:
      color_temp_kelvin: !input start_kelvin_temp
      brightness_pct: !input start_brightness
      entity_id: !input target_light
  - delay:
      seconds: 5
  - action: !input alarm_script
    data:
      target_kelvin: !input target_kelvin_1
      start_kelvin: !input start_kelvin_temp
      max_brightness_pct: !input max_brightness_1
      alarm_length: !input alarm_length_1
      steps_per_minute: !input steps_per_minute
      light_timeout: 0
      target_light: !input target_light
  - if:
      - condition: state
        state: "on"
        entity_id: !input target_light
    then:
      - action: !input alarm_script
        data:
          target_kelvin: !input target_kelvin_2
          start_kelvin: !input target_kelvin_1
          max_brightness_pct: !input max_brightness_2
          alarm_length: !input alarm_length_2
          steps_per_minute: !input steps_per_minute
          light_timeout: 0
          target_light: !input target_light
  - if:
      - condition: state
        state: "on"
        entity_id: !input target_light
    then:
      - action: !input alarm_script
        data:
          target_kelvin: !input target_kelvin_3
          start_kelvin: !input target_kelvin_2
          max_brightness_pct: !input max_brightness_3
          alarm_length: !input alarm_length_3
          steps_per_minute: !input steps_per_minute
          light_timeout: !input light_timeout
          target_light: !input target_light
      - !input post_action
mode: single
